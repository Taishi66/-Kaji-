title: "❓ Question: [Brief summary]"
labels:
  - help
body:
  - type: markdown
    attributes:
      value: |
        💡 Before posting, please attach your **rage bundle** — it helps debug faster and saves everyone time.  
        Run `kaji rage` and attach the generated `kaji-rage-*.json`.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue in detail and attach your diagnostics zip if possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the issue — commands, steps, or context.
  - type: textarea
    id: version
    attributes:
      label: Kaji version and environment
      description: Include your Kaji version and operating system if known.
