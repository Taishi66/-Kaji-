on:
  workflow_dispatch:
    inputs:
      target:
        description: 'macOS Rust target'
        required: true
        type: choice
        default: aarch64-apple-darwin
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: 'Version to set for the build'
        required: false
        default: ""
        type: string
      target:
        description: 'macOS Rust target: aarch64-apple-darwin or x86_64-apple-darwin'
        required: true
        type: string
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA). Defaults to main branch if not specified.'
        required: false
        type: string
        default: ''

name: "Bundle CLI (macOS)"

jobs:
  build-kaji:
    name: Build Kaji (macOS)
    runs-on: ${{ inputs.target == 'x86_64-apple-darwin' && 'macos-15-intel' || 'macos-latest' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    permissions:
      contents: read
    steps:
      - name: Debug workflow info
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PACKAGE_CLI: ${{ inputs.package_cli }}
        run: |
          echo "=== Workflow Information ==="
          echo "Workflow: ${WORKFLOW_NAME}"
          echo "Ref: ${WORKFLOW_REF}"
          echo "Event: ${EVENT_NAME}"
          echo "Repo: ${REPOSITORY}"
          echo ""
          echo "=== Input Parameters ==="
          echo "Build ref: ${INPUT_REF:-<default branch>}"
          echo "Version: ${INPUT_VERSION:-not set}"
          echo "Target: ${INPUT_TARGET}"
          echo "Package CLI: ${INPUT_PACKAGE_CLI:-false}"

      - name: Check initial disk space
        run: df -h

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Debug git status
        run: |
          echo "=== Git Status ==="
          git status
          echo ""
          echo "=== Current Commit ==="
          git rev-parse HEAD
          git rev-parse --abbrev-ref HEAD
          echo ""
          echo "=== Recent Commits ==="
          git log --oneline -n 5
          echo ""
          echo "=== Remote Branches ==="
          git branch -r

      - name: Update Cargo version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/set-cargo-version.sh "$VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ inputs.target == 'x86_64-apple-darwin' && 'intel-macos-deployment-target-12' || 'macos-deployment-target-12' }}

      - name: Build kaji
        env:
          TARGET: ${{ inputs.target }}
        run: |
          source ./bin/activate-hermit
          rustup target add "$TARGET"
          cargo build --release -p kaji-cli --bin kaji --target "$TARGET"

      - name: Prepare binary artifact
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p artifacts
          cp "target/${TARGET}/release/kaji" "artifacts/internal-kaji-${TARGET}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-kaji-${{ inputs.target }}
          path: artifacts/internal-kaji-${{ inputs.target }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-cli:
    name: Package CLI (macOS)
    if: ${{ inputs.package_cli }}
    needs: build-kaji
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-kaji-${{ inputs.target }}
          path: package

      - name: Package CLI
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mv "package/internal-kaji-${TARGET}" package/kaji
          chmod +x package/kaji
          mkdir -p dist
          tar -cjf "dist/kaji-${TARGET}.tar.bz2" -C package .
          tar -czf "dist/kaji-${TARGET}.tar.gz" -C package .

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kaji-${{ inputs.target }}
          path: |
            dist/kaji-${{ inputs.target }}.tar.bz2
            dist/kaji-${{ inputs.target }}.tar.gz
          if-no-files-found: error
          overwrite: true
