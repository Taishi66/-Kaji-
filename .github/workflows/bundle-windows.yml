name: "Bundle CLI (Windows)"

on:
  workflow_dispatch:
    inputs:
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        type: boolean
        default: false
      windows_variant:
        description: 'Windows artifact variant: standard or cuda'
        required: false
        type: choice
        options:
          - standard
          - cuda
        default: 'standard'
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: false
        type: string
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      windows_variant:
        description: 'Windows artifact variant: standard or cuda'
        required: false
        type: string
        default: 'standard'

permissions:
  contents: read

jobs:
  build-kaji-windows:
    name: Build Kaji (Windows)
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Update Cargo version
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/set-cargo-version.sh "$VERSION"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: windows-msvc-${{ inputs.windows_variant }}

      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Install CUDA toolkit
        if: ${{ inputs.windows_variant == 'cuda' }}
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76  # v0.2.35
        with:
          cuda: '12.9.1'
          method: 'local'
          log-file-suffix: 'bundle-windows-cuda.txt'

      - name: Set up MSVC developer environment
        if: ${{ inputs.windows_variant == 'cuda' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      - name: Verify CUDA toolchain
        if: ${{ inputs.windows_variant == 'cuda' }}
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: "80"
        run: |
          Write-Output "CUDA_PATH=$env:CUDA_PATH"
          Write-Output "CUDA_COMPUTE_CAP=$env:CUDA_COMPUTE_CAP"
          where.exe cl
          where.exe nvcc
          nvcc -V

      - name: Build Windows executable
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: ${{ inputs.windows_variant == 'cuda' && '80' || '' }}
        run: |
          $isCuda = "${{ inputs.windows_variant }}" -eq "cuda"

          if ($isCuda) {
            cargo build --release --target x86_64-pc-windows-msvc -p kaji-cli --bin kaji --features cuda
          } else {
            cargo build --release --target x86_64-pc-windows-msvc -p kaji-cli --bin kaji
          }

          $binaryPath = "./target/x86_64-pc-windows-msvc/release/kaji.exe"
          if (-not (Test-Path $binaryPath)) {
            Write-Error "Windows binary not found: $binaryPath"
            Get-ChildItem ./target/x86_64-pc-windows-msvc/release/ -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Item $binaryPath

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-kaji-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: target/x86_64-pc-windows-msvc/release/kaji.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-cli-windows:
    name: Package CLI (Windows)
    if: ${{ inputs.package_cli }}
    needs: build-kaji-windows
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-kaji-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: package

      - name: Package CLI
        shell: bash
        env:
          VARIANT_SUFFIX: ${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
        run: |
          mkdir -p kaji-package
          cp package/kaji.exe kaji-package/
          7z a -tzip "kaji-x86_64-pc-windows-msvc${VARIANT_SUFFIX}.zip" kaji-package/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kaji-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: kaji-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}.zip
          if-no-files-found: error
          overwrite: true
