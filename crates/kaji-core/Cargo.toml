[package]
name = "kaji-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "KAJI core : agent loop, memory, context (toggle SDD/AIAD)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { version = "3.10.1", default-features = false }